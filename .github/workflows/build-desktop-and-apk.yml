name: Build Android (.apk) & Desktop (.exe / .dmg / .AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android .apk (Capacitor 7 + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up JDK 21 for Capacitor 7 / Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Android .apk
        run: npm run android:apk

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Flappy-NeuroLab-Android-APK
          path: Flappy-NeuroLab-android.apk
          if-no-files-found: error
          retention-days: 30

  build-desktop-app:
    name: Build Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64-EXE-MSI
          - os: macos-latest
            label: macOS-DMG-APP
          - os: ubuntu-22.04
            label: Linux-x64-AppImage-DEB
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Linux WebKit2GTK & Tauri v2 dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Tauri app icons & build Desktop Installer
        shell: bash
        env:
          NO_STRIP: 'true'
        run: |
          npm install --no-save --no-audit --no-fund @tauri-apps/cli@^2.0.0
          npx tauri icon public/favicon.svg
          node -e "
            const fs = require('fs');
            const cfgPath = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(cfgPath, 'utf8'));
            const iconFiles = ['icons/32x32.png', 'icons/128x128.png', 'icons/128x128@2x.png', 'icons/icon.icns', 'icons/icon.ico'];
            cfg.bundle.icon = iconFiles.filter((p) => fs.existsSync('src-tauri/' + p));
            fs.writeFileSync(cfgPath, JSON.stringify(cfg, null, 2) + '\n');
          "
          npx tauri build

      - name: Upload Desktop Installer Artifacts (${{ matrix.label }})
        uses: actions/upload-artifact@v6
        with:
          name: Flappy-NeuroLab-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 30
