name: Build Android (.apk) & Desktop (.exe / .dmg / .AppImage)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android .apk (Capacitor + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Android .apk
        run: npm run android:apk

      - name: Upload Android .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-NeuroLab-Android-APK
          path: Flappy-NeuroLab-android.apk
          retention-days: 30

  build-desktop-app:
    name: Build Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64-EXE-MSI
          - os: macos-latest
            label: macOS-DMG-APP
          - os: ubuntu-22.04
            label: Linux-x64-AppImage-DEB
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux WebKit2GTK dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies & build web bundle
        run: |
          npm ci
          npm run build

      - name: Generate default Tauri app icons & build Desktop Installer
        run: |
          npm install --no-save @tauri-apps/cli@^2.0.0
          npx tauri icon public/favicon.svg || true
          npx tauri build

      - name: Upload Desktop Installer Artifacts (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-NeuroLab-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
          retention-days: 30
